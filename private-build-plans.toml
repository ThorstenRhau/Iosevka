[buildPlans.IosevkaCustom]
family           = "Iosevka Custom"
spacing          = "term"
serifs           = "sans"
noCvSs           = false
noLigation       = false
exportGlyphNames = true

[buildPlans.IosevkaCustom.variants.design]
zero             = "reverse-slashed"
one              = "base"
two              = "curly-neck-serifless"
three            = "two-arcs"
four             = "semi-open-serifless"
five             = "upright-arched-serifless"
six              = "closed-contour"
seven            = "straight-serifless-crossbar"
eight            = "crossing"
nine             = "closed-contour"
capital-a        = "straight-serifless"
capital-b        = "standard-serifless"
capital-d        = "more-rounded-serifless"
capital-g        = "toothed-serifless-hooked"
capital-i        = "serifed"
capital-j        = "serifless"
capital-m        = "flat-bottom-serifless"
capital-q        = "crossing"
capital-w        = "straight-flat-top-serifless"
a                = "double-storey-serifless"
f                = "flat-hook-serifless"
g                = "double-storey"
i                = "hooky"
j                = "serifed"
l                = "tailed"
q                = "diagonal-tailed-serifless"
r                = "compact-serifless"
t                = "flat-hook"
asterisk         = "hex-low"
brace            = "straight"
ampersand        = "upper-open"
percent          = "dots"
paren            = "normal"

[buildPlans.IosevkaCustom.variants.italic]
a                = "single-storey-serifless"
e                = "flat-crossbar"
f                = "flat-hook-serifless"
i                = "hooky"
l                = "tailed"
y                = "straight-turn-serifless"

[buildPlans.IosevkaCustom.ligations]
inherits         = "default-calt"

[buildPlans.IosevkaCustom.weights.Regular]
shape = 400
menu  = 400
css   = 400

[buildPlans.IosevkaCustom.weights.Book]
shape = 450
menu  = 450
css   = 450

[buildPlans.IosevkaCustom.weights.Medium]
shape = 500
menu  = 500
css   = 500

[buildPlans.IosevkaCustom.weights.Bold]
shape = 700
menu  = 700
css   = 700

[buildPlans.IosevkaCustom.widths.Normal]
shape = 500
menu  = 5
css   = "normal"

[buildPlans.IosevkaCustom.widths.Extended]
shape = 576
menu  = 7
css   = "expanded"

[buildPlans.IosevkaCustom.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.IosevkaCustom.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"

[buildPlans.IosevkaCustom.metricOverride]
leading = 1200
